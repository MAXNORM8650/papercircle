rk architecture (originally introduced by Ronneberger et al., 2015) that has been extended to video generation by inflating it with additional temporal layers."}, {"id": "concept_21841345", "label": "Temporal Layers", "type": "concept", "description": "Additional layers added to image-based models to enable them to process temporal information, allowing for video generation rather than just image generation."}, {"id": "concept_b242b853", "label": "Text-to-Video Diffusion Models", "type": "concept", "description": "Advanced diffusion models that generate high-quality, high-resolution videos from text descriptions. These models represent the latest developments in the field."}, {"id": "concept_400938a5", "label": "Autoregressive denoising frame", "type": "concept", "description": "A framework that combines autoregression's long-horizon modeling with diffusion's high-fidelity synthesis for video generation. It models video sequences as a product of conditional probabilities wher"}, {"id": "concept_7c0a6f26", "label": "Flow matching", "type": "concept", "description": "A training method used to train the flow model by estimating the clean direction of noisy interpolations. It minimizes the difference between the predicted and ground-truth velocity fields during trai"}, {"id": "concept_d4e6c35e", "label": "Noisy interpolation", "type": "concept", "description": "A technique for generating noisy versions of target chunks by creating a linear interpolation between a starting point and random noise. This is used to train the denoising model in the autoregressive"}, {"id": "concept_da0ec147", "label": "Iterative AR-denoising loop", "type": "concept", "description": "The process that enables long-range, consistent, and high-quality video prediction through repeated denoising steps. It iteratively generates chunks by denoising from noise and appending to the histor"}];
        const links = [{"source": "paper_2512_08931", "target": "sec_1", "type": "has_section"}, {"source": "paper_2512_08931", "target": "sec_1", "type": "has_section"}, {"source": "paper_2512_08931", "target": "sec_2", "type": "has_section"}, {"source": "paper_2512_08931", "target": "sec_2", "type": "has_section"}, {"source": "paper_2512_08931", "target": "sec_3", "type": "has_section"}, {"source": "paper_2512_08931", "target": "sec_2", "type": "has_section"}, {"source": "sec_3", "target": "sec_3_1", "type": "has_subsection"}, {"source": "sec_3", "target": "sec_3_2", "type": "has_subsection"}, {"source": "sec_3", "target": "sec_3_3", "type": "has_subsection"}, {"source": "paper_2512_08931", "target": "sec_5", "type": "has_section"}, {"source": "sec_3", "target": "sec_3_4", "type": "has_subsection"}, {"source": "paper_2512_08931", "target": "sec_4", "type": "has_section"}, {"source": "paper_2512_08931", "target": "sec_850", "type": "has_section"}, {"source": "paper_2512_08931", "target": "sec_9978", "type": "has_section"}, {"source": "sec_0", "target": "sec_0_691", "type": "has_subsection"}, {"source": "sec_0", "target": "sec_0_748", "type": "has_subsection"}, {"source": "sec_0", "target": "sec_0_741", "type": "has_subsection"}, {"source": "sec_4", "target": "sec_4_2", "type": "has_subsection"}, {"source": "sec_4", "target": "sec_4_3", "type": "has_subsection"}, {"source": "sec_4", "target": "sec_4_4", "type": "has_subsection"}, {"source": "sec_0", "target": "sec_0_727", "type": "has_subsection"}, {"source": "paper_2512_08931", "target": "sec_5", "type": "has_section"}, {"source": "paper_2512_08931", "target": "sec_10", "type": "has_section"}, {"source": "paper_2512_08931", "target": "sec_14", "type": "has_section"}, {"source": "sec_0", "target": "sec_0_691", "type": "has_subsection"}, {"source": "sec_0", "target": "sec_0_741", "type": "has_subsection"}, {"source": "sec_0", "target": "sec_0_748", "type": "has_subsection"}, {"source": "sec_0", "target": "sec_0_635",         const width = document.getElementById('graph').clientWidth;
        const height = 600;
        
        const svg = d3.select('#graph')
            .append('svg')
            .attr('width', width)
            .attr('height', height);
        
        const simulation = d3.forceSimulation(nodes)
            .force('link', d3.forceLink(links).id(d => d.id).distance(100))
            .force('charge', d3.forceManyBody().strength(-200))
            .force('center', d3.forceCenter(width / 2, height / 2));
        
        const link = svg.append('g')
            .selectAll('line')
            .data(links)
            .join('line')
            .attr('class', 'link');
        
        const node = svg.append('g')
            .selectAll('g')
            .data(nodes)
            .join('g')
            .attr('class', d => 'node node-' + d.type)
            .call(d3.drag()
                .on('start', dragstarted)
                .on('drag', dragged)
                .on('end', dragended));
        
        node.append('circle')
            .attr('r', d => d.type === 'paper' ? 15 : 8);
        
        node.append('text')
            .attr('dx', 12)
            .attr('dy', 4)
            .text(d => d.label);
        
        node.on('click', (event, d) => {
            document.getElementById('info').innerHTML = 
                '<strong>' + d.label + '</strong> (' + d.type + ')<br>' +
                d.description;
        });
        
        simulation.on('tick', () => {
            link
                .attr('x1', d => d.source.x)
                .attr('y1', d => d.source.y)
                .attr('x2', d => d.target.x)
                .attr('y2', d => d.target.y);
            
            node.attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');
        });
        
        function dragstarted(event) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            event.subject.fx = event.subject.x;
            event.subject.fy = event.subject.y;
        }
        
        function dragged(event) {
            event.subject.fx = event.x;
            event.subject.fy = event.y;
        }
        
        function dragended(event) {
            if (!event.active) simulation.alphaTarget(0);
            event.subject.fx = null;
            event.subject.fy = null;
        }
