<svg
  width="512"
  height="512"
  viewBox="-150 -150 290 290"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" />
      <feOffset dx="1" dy="1" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Single paper definition -->
    <g id="paper">
      <path d="M 0 0 L 45 0 L 60 15 L 60 85 L 0 85 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.5" />
      <path d="M 45 0 L 45 15 L 60 15 Z" fill="#cbd5e1" opacity="0.8" />

      <rect x="9" y="21" width="30" height="3.4" rx="1" fill="#3b82f6" opacity="0.8" />

      <rect x="9" y="29" width="42" height="2.5" rx="1" fill="#94a3b8" />
      <rect x="9" y="35" width="42" height="2.5" rx="1" fill="#94a3b8" />
      <rect x="9" y="41" width="42" height="2.5" rx="1" fill="#94a3b8" />
      <rect x="9" y="47" width="24" height="2.5" rx="1" fill="#94a3b8" />

      <rect x="9" y="59" width="18" height="18" rx="2" stroke="#3b82f6" stroke-width="1" fill="none" opacity="0.5" />

      <path d="M 9 72 L 14 64 L 19 67 L 24 60" fill="none" stroke="#3b82f6" stroke-width="1" stroke-linecap="round" />
    </g>
  </defs>
  <!-- Global rotation -->
  <g transform="rotate(16)">
    <!-- 24 papers in a ring (spiralOffset ≈ 100) -->

    <!-- 1 -->
    <g transform="rotate(0) translate(0,-100)">
      <g transform="translate(-30,-42.5)" filter="url(#shadow)">
        <use href="#paper" />
      </g>
    </g>

    <!-- 2 -->
    <g transform="rotate(15) translate(0,-100)">
      <g transform="translate(-30,-42.5)" filter="url(#shadow)">
        <use href="#paper" />
      </g>
    </g>

    <!-- 3 -->
    <g transform="rotate(30) translate(0,-100)">
      <g transform="translate(-30,-42.5)" filter="url(#shadow)">
        <use href="#paper" />
      </g>
    </g>

    <!-- 4 -->
    <g transform="rotate(45) translate(0,-100)">
      <g transform="translate(-30,-42.5)" filter="url(#shadow)">
        <use href="#paper" />
      </g>
    </g>

    <!-- 5 -->
    <g transform="rotate(60) translate(0,-100)">
      <g transform="translate(-30,-42.5)" filter="url(#shadow)">
        <use href="#paper" />
      </g>
    </g>

    <!-- 6 -->
    <g transform="rotate(75) translate(0,-100)">
      <g transform="translate(-30,-42.5)" filter="url(#shadow)">
        <use href="#paper" />
      </g>
    </g>

    <!-- 7 -->
    <g transform="rotate(90) translate(0,-100)">
      <g transform="translate(-30,-42.5)" filter="url(#shadow)">
        <use href="#paper" />
      </g>
    </g>

    <!-- 8 -->
    <g transform="rotate(105) translate(0,-100)">
      <g transform="translate(-30,-42.5)" filter="url(#shadow)">
        <use href="#paper" />
      </g>
    </g>

    <!-- 9 -->
    <g transform="rotate(120) translate(0,-100)">
      <g transform="translate(-30,-42.5)" filter="url(#shadow)">
        <use href="#paper" />
      </g>
    </g>

    <!-- 10 -->
    <g transform="rotate(135) translate(0,-100)">
      <g transform="translate(-30,-42.5)" filter="url(#shadow)">
        <use href="#paper" />
      </g>
    </g>

    <!-- 11 -->
    <g transform="rotate(150) translate(0,-100)">
      <g transform="translate(-30,-42.5)" filter="url(#shadow)">
        <use href="#paper" />
      </g>
    </g>

    <!-- 12 -->
    <g transform="rotate(165) translate(0,-100)">
      <g transform="translate(-30,-42.5)" filter="url(#shadow)">
        <use href="#paper" />
      </g>
    </g>

    <!-- 13 -->
    <g transform="rotate(180) translate(0,-100)">
      <g transform="translate(-30,-42.5)" filter="url(#shadow)">
        <use href="#paper" />
      </g>
    </g>

    <!-- 14 -->
    <g transform="rotate(195) translate(0,-100)">
      <g transform="translate(-30,-42.5)" filter="url(#shadow)">
        <use href="#paper" />
      </g>
    </g>

    <!-- 15 -->
    <g transform="rotate(210) translate(0,-100)">
      <g transform="translate(-30,-42.5)" filter="url(#shadow)">
        <use href="#paper" />
      </g>
    </g>

    <!-- 16 -->
    <g transform="rotate(225) translate(0,-100)">
      <g transform="translate(-30,-42.5)" filter="url(#shadow)">
        <use href="#paper" />
      </g>
    </g>

    <!-- 17 -->
    <g transform="rotate(240) translate(0,-100)">
      <g transform="translate(-30,-42.5)" filter="url(#shadow)">
        <use href="#paper" />
      </g>
    </g>

    <!-- 18 -->
    <g transform="rotate(255) translate(0,-100)">
      <g transform="translate(-30,-42.5)" filter="url(#shadow)">
        <use href="#paper" />
      </g>
    </g>

    <!-- 19 -->
    <g transform="rotate(270) translate(0,-100)">
      <g transform="translate(-30,-42.5)" filter="url(#shadow)">
        <use href="#paper" />
      </g>
    </g>

    <!-- 20 -->
    <g transform="rotate(285) translate(0,-100)">
      <g transform="translate(-30,-42.5)" filter="url(#shadow)">
        <use href="#paper" />
      </g>
    </g>

    <!-- 21 -->
    <g transform="rotate(300) translate(0,-100)">
      <g transform="translate(-30,-42.5)" filter="url(#shadow)">
        <use href="#paper" />
      </g>
    </g>

    <!-- 22 -->
    <g transform="rotate(315) translate(0,-100)">
      <g transform="translate(-30,-42.5)" filter="url(#shadow)">
        <use href="#paper" />
      </g>
    </g>

    <!-- 23 -->
    <g transform="rotate(330) translate(0,-100)">
      <g transform="translate(-30,-42.5)" filter="url(#shadow)">
        <use href="#paper" />
      </g>
    </g>

    <!-- 24 -->
    <g transform="rotate(345) translate(0,-100)">
      <g transform="translate(-30,-42.5)" filter="url(#shadow)">
        <use href="#paper" />
      </g>
    </g>
    <circle cx="0" cy="0" r="50" fill="#7c3aed" />
  </g>
</svg>


